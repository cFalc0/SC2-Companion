<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#102840" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90d8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a5090" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- ambient glow -->
  <circle cx="32" cy="32" r="30" fill="url(#sbg)"/>
  <!-- backpack -->
  <rect x="13" y="27" width="6" height="15" rx="2" fill="#182838" stroke="#2d6080" stroke-width="1"/>
  <!-- body -->
  <rect x="19" y="27" width="22" height="24" rx="3" fill="#1a3248" stroke="#3070a8" stroke-width="1.5"/>
  <!-- belt detail -->
  <rect x="19" y="37" width="22" height="3" rx="1" fill="#142838" stroke="#2a5888" stroke-width="0.8" opacity="0.8"/>
  <!-- helmet -->
  <rect x="21" y="13" width="18" height="18" rx="5" fill="#142030" stroke="#3878b8" stroke-width="1.5"/>
  <!-- visor -->
  <rect x="24" y="17" width="12" height="9" rx="2" fill="url(#visor)"/>
  <!-- visor reflection line -->
  <line x1="25" y1="19" x2="31" y2="19" stroke="#d0f0ff" stroke-width="0.9" opacity="0.6"/>
  <!-- drill arm housing -->
  <rect x="41" y="29" width="10" height="8" rx="2" fill="#1e3c58" stroke="#3070a8" stroke-width="1"/>
  <!-- drill tip -->
  <polygon points="51,30 60,33 51,36" fill="#4890c0" stroke="#3070a8" stroke-width="0.8"/>
  <!-- drill spiral -->
  <line x1="51" y1="31.5" x2="58" y2="33" stroke="#80b8d8" stroke-width="0.7" opacity="0.8"/>
  <!-- legs -->
  <rect x="21" y="50" width="7" height="9" rx="2" fill="#142030" stroke="#2e6898" stroke-width="1"/>
  <rect x="32" y="50" width="7" height="9" rx="2" fill="#142030" stroke="#2e6898" stroke-width="1"/>
  <!-- shoulder light -->
  <circle cx="20" cy="28" r="2.2" fill="#ffee44" opacity="0.95"/>
  <circle cx="20" cy="28" r="3.8" fill="#ffee44" opacity="0.12"/>
</svg>
