<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="pbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a3000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#100800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pcore" cx="38%" cy="33%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff5b0"/>
      <stop offset="65%" stop-color="#e08820"/>
      <stop offset="100%" stop-color="#804010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ambient glow -->
  <circle cx="32" cy="32" r="30" fill="url(#pbg)"/>
  <!-- orbital rings -->
  <ellipse cx="32" cy="33" rx="26" ry="7.5" fill="none" stroke="#b07020" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="32" cy="33" rx="20" ry="5.5" fill="none" stroke="#c08030" stroke-width="0.8" opacity="0.45"/>
  <!-- top fin -->
  <path d="M32 8 L23 21 L41 21 Z" fill="#1e1000" stroke="#c87828" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="32" cy="33" rx="12" ry="15" fill="#1a0c04" stroke="#d09030" stroke-width="2"/>
  <!-- side fins -->
  <path d="M20 28 L10 33 L20 38" fill="#160a02" stroke="#b07020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 28 L54 33 L44 38" fill="#160a02" stroke="#b07020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- energy core glow -->
  <circle cx="32" cy="32" r="10" fill="#e08820" opacity="0.08"/>
  <!-- energy core -->
  <circle cx="32" cy="32" r="7" fill="url(#pcore)"/>
  <!-- bottom fin -->
  <path d="M26 47 L32 58 L38 47" fill="#1e1000" stroke="#c87828" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
