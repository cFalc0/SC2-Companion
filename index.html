<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SC2 Companion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <header>
      <div class="header-title">
        <img class="header-icon" src="assets/zerg-icon.svg" alt="" aria-hidden="true" onerror="this.style.display='none'">
        SC2 Companion
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Open settings">⚙</button>
    </header>

    <!-- ── Settings Drawer ─────────────────────────────────── -->
    <div id="settings-panel" class="drawer hidden" role="dialog" aria-label="Settings">
      <div class="drawer-header">
        <h2>Settings</h2>
        <button id="settings-close" class="icon-btn" aria-label="Close settings">✕</button>
      </div>

      <div class="form-group">
        <label for="api-key">ElevenLabs API Key</label>
        <input type="password" id="api-key" placeholder="Paste your API key…" autocomplete="off">
        <p class="hint">Stored locally in your browser. Leave blank to use browser TTS (free, offline).</p>
      </div>

      <div class="form-group">
        <label for="voice-id">Voice ID</label>
        <input type="text" id="voice-id" placeholder="e.g. 21m00Tcm4TlvDq8ikWAM">
        <p class="hint">Find voice IDs in your ElevenLabs dashboard.</p>
      </div>

      <div class="form-group">
        <label for="volume">Volume — <span id="volume-label">80%</span></label>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8">
      </div>

      <div class="form-group">
        <label class="toggle-label">
          <input type="checkbox" id="tts-enabled" checked>
          <span>Enable voice coaching</span>
        </label>
      </div>

      <div class="btn-row">
        <button id="save-settings" class="btn-primary">Save</button>
        <button id="test-voice-btn" class="btn-ghost">Test voice</button>
      </div>
    </div>

    <!-- ── State: Race Select ──────────────────────────────── -->
    <div id="state-race-select" class="state-panel">
      <p class="state-label">You are <span class="zerg-text">Zerg</span>. Who is your opponent?</p>
      <div id="race-grid">
        <button class="race-btn" data-race="zvt">
          <span class="race-icon terran-icon">⚙</span>
          <span class="race-name">Terran</span>
          <span class="race-tag">ZvT</span>
        </button>
        <button class="race-btn" data-race="zvp">
          <span class="race-icon protoss-icon">✦</span>
          <span class="race-name">Protoss</span>
          <span class="race-tag">ZvP</span>
        </button>
        <button class="race-btn" data-race="zvz">
          <span class="race-icon zerg-icon">⬡</span>
          <span class="race-name">Zerg</span>
          <span class="race-tag">ZvZ</span>
        </button>
        <button class="race-btn" data-race="zvrandom">
          <span class="race-icon random-icon">?</span>
          <span class="race-name">Random</span>
          <span class="race-tag">ZvR</span>
        </button>
      </div>
    </div>

    <!-- ── State: Standby ─────────────────────────────────── -->
    <div id="state-standby" class="state-panel hidden">
      <div id="standby-race-badge"></div>
      <div id="standby-prompt">
        <div class="standby-key-hint">
          <kbd>SPACE</kbd>
          <span>or tap here</span>
        </div>
        <p id="standby-instruction">when your game begins</p>
      </div>
      <button id="cancel-btn" class="btn-ghost">← Change opponent</button>
    </div>

    <!-- ── State: Coaching ────────────────────────────────── -->
    <div id="state-coaching" class="state-panel hidden">

      <div class="coaching-header">
        <span id="match-label" class="match-badge"></span>
        <button id="back-btn" class="btn-ghost small">← End session</button>
      </div>

      <!-- Timer -->
      <div id="timer-block">
        <div id="timer-display">
          <span id="timer-min">0</span>:<span id="timer-sec">00</span>
        </div>
        <p id="timer-sub">Press <kbd>SPACE</kbd> to pause</p>
      </div>

      <!-- Next cue preview -->
      <div id="next-cue-card" class="cue-card">
        <div class="cue-card-label">NEXT CUE</div>
        <div id="next-cue-text" class="cue-text">—</div>
        <div id="next-cue-time" class="cue-time"></div>
      </div>

      <!-- Active (just-fired) cue -->
      <div id="active-cue-card" class="cue-card active-cue hidden">
        <div class="cue-card-label">NOW ▶</div>
        <div id="active-cue-text" class="cue-text"></div>
      </div>

      <!-- Cue log -->
      <div id="log-section">
        <div class="log-header">
          <span class="log-title">SPOKEN CUES</span>
          <span id="log-count"></span>
        </div>
        <ul id="log-list" aria-live="polite" aria-label="Spoken cues log"></ul>
      </div>

    </div>

    <!-- ── Status toast ───────────────────────────────────── -->
    <div id="status-bar" class="hidden" role="status" aria-live="polite">
      <span id="status-text"></span>
    </div>

  </div><!-- #app -->

  <script src="js/tts.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
